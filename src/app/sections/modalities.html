<section id="modalidades"><div class="wrap">
  <h2 reveal>Trabaja con nosotros como mejor te convenga</h2>
  <p class="lead" reveal>Tres formas de contratar, según el tamaño de tu necesidad y tu presupuesto.</p>
  <div class="grid">
    @for (m of modes; track m.title) {
      <article class="card" reveal tilt><h3>{{ m.title }}</h3><p>{{ m.text }}</p><p style="margin-top:12px;color:var(--cyan)">{{ m.note }}</p></article>
    }
  </div>
  <div class="grid" style="margin-top:20px">
    @for (p of perks; track p.title) { <article class="card" reveal tilt><h3>{{ p.title }}</h3><p>{{ p.text }}</p></article> }
  </div>
</div></section>
