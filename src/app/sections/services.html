<section id="servicios"><div class="wrap">
  <h2 reveal>Todo lo que tu empresa necesita para ir más rápido</h2>
  <p class="lead" reveal>Soluciones tecnológicas pensadas según las necesidades de tu negocio, desde la idea hasta el soporte.</p>
  <div class="grid">
    @for (s of services; track s.title) {
      <article class="card" reveal tilt>
        <div class="ico"><svg viewBox="0 0 24 24"><path [attr.d]="s.icon" /></svg></div>
        <h3>{{ s.title }}</h3><p>{{ s.text }}</p>
      </article>
    }
  </div>
</div></section>
