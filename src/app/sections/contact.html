<section id="contacto" style="padding-top:40px"><div class="wrap contact">
  <div reveal>
    <h2>Hablemos de tu proyecto</h2>
    <p class="lead">Cuéntanos qué necesitas y te respondemos con una propuesta, sin compromiso.</p>
    <div class="info">
      <a [href]="'https://wa.me/' + c.wa" target="_blank" rel="noopener"><span><b>{{ c.phone }}</b>{{ c.hours }}</span></a>
      <a [href]="'mailto:' + c.email"><span><b>{{ c.email }}</b>Escríbenos cuando quieras</span></a>
      <div><span><b>{{ c.city }}</b>Atendemos a todo el país</span></div>
    </div>
  </div>
  <form reveal (ngSubmit)="send()">
    <label>Nombre<input name="n" [(ngModel)]="name" required autocomplete="name"></label>
    <label>Correo o teléfono<input name="c" [(ngModel)]="contact" required autocomplete="email"></label>
    <label>Servicio de interés
      <select name="s" [(ngModel)]="service">@for (s of options; track s) { <option>{{ s }}</option> }</select>
    </label>
    <label>¿Qué necesitas?<textarea name="m" [(ngModel)]="msg" required placeholder="Ej: un sistema de ventas para mi tienda"></textarea></label>
    <button class="btn primary" type="submit" style="justify-content:center">Enviar por WhatsApp</button>
    <p class="ok" role="status">{{ ok() }}</p>
  </form>
</div></section>
