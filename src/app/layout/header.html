<header id="top" [class.solid]="solid()">
  <div class="wrap nav">
    <a href="#inicio" class="logo" aria-label="IdsNova, inicio"><img src="logo.png" alt="IdsNova innovación digital"></a>
    <nav aria-label="Principal">
      <ul [class.open]="open()">
        @for (n of nav; track n.href) { <li><a [href]="n.href" (click)="open.set(false)">{{ n.label }}</a></li> }
        <li><a class="btn primary" href="#contacto" (click)="open.set(false)">Cotiza tu proyecto</a></li>
      </ul>
    </nav>
    <button class="burger" aria-label="Abrir menú" [attr.aria-expanded]="open()" (click)="open.set(!open())">☰</button>
  </div>
</header>
